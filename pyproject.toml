[project]
name = "jagadish-coding-assistant-governance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]
lint.ignore = ["E401", "E701", "E702", "E731"]
